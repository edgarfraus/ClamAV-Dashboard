<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign in')}"></head>
<body>
<div class="login-shell">
  <div class="card shadow-sm" style="width:100%;max-width:400px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <img src="/images/logo.jpg" alt="" class="login-logo"/>
        <h4 class="mt-3 mb-1">ClamAV Dashboard</h4>
        <div class="text-body-secondary small">Management console for ClamAV</div>
      </div>

      <div class="alert alert-danger py-2" th:if="${param.error}">
        Invalid username or password.
      </div>
      <div class="alert alert-success py-2" th:if="${param.logout}">
        You have been logged out.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control" id="username" name="username" autofocus="autofocus" required="required"/>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password" required="required"/>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="fa-solid fa-right-to-bracket"></i> Sign in
        </button>
      </form>

      <div class="text-body-secondary small mt-4 text-center">
        Default on first run: <strong>admin</strong> / <strong>admin</strong><br/>
        change it right after logging in.
      </div>
    </div>
  </div>
</div>
<script src="/js/coreui.bundle.min.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
