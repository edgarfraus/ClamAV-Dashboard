<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login · ClamAV Web Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"/>
  <link rel="stylesheet" href="/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css"/>
  <link rel="stylesheet" href="/css/all.css"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="icon" href="/icons/favicon.ico"/>
</head>
<body data-theme="dark">
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; padding:18px;">
  <div class="card" style="width: 100%; max-width: 380px;">
    <div class="card-body">
      <div class="text-center mb-3">
        <img src="/images/logo.jpg" alt="logo" style="width:56px;height:56px;border-radius:14px;"/>
        <h4 class="card-title mt-3 mb-0">ClamAV Web Client</h4>
        <div class="muted">Sign in to continue</div>
      </div>

      <div class="alert alert-danger" th:if="${param.error}">
        Invalid username or password.
      </div>
      <div class="alert alert-success" th:if="${param.logout}">
        You have been logged out.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input type="text" class="form-control" id="username" name="username" autofocus="autofocus" required="required"/>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password" required="required"/>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>

      <div class="muted mt-3" style="font-size:12px;">
        Default on first run: <strong>admin</strong> / <strong>admin</strong> — change it right after logging in.
      </div>
    </div>
  </div>
</div>
<script src="/js/script.js"></script>
</body>
</html>
