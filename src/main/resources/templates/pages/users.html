<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Users')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<div class="wrapper d-flex flex-column min-vh-100">
  <div th:replace="~{fragments/layout :: header('Users')}"></div>

  <div class="body flex-grow-1">
    <div class="container-lg px-4">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
        <div class="text-body-secondary small">Manage accounts that can sign in to this console</div>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <div class="d-flex align-items-center gap-3 mb-4">
            <span class="row-icon is-ok"><i class="fa-solid fa-user-plus"></i></span>
            <div class="card-title mb-0">Add user</div>
          </div>
          <form th:action="@{/admin/users/create}" method="post" class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" name="username" required="required"/>
            </div>
            <div class="col-md-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" name="password" required="required"/>
            </div>
            <div class="col-md-3">
              <label class="form-label">Role</label>
              <select class="form-select" name="role">
                <option value="VIEWER">VIEWER (read only)</option>
                <option value="OPERATOR">OPERATOR (can scan)</option>
                <option value="ADMIN">ADMIN (full access)</option>
              </select>
            </div>
            <div class="col-md-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="enabled" value="true" id="newUserEnabled" checked="checked"/>
                <label class="form-check-label" for="newUserEnabled" style="font-size:12px;">Enabled</label>
              </div>
            </div>
            <div class="col-md-1">
              <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-plus"></i></button>
            </div>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-body pb-0">
          <div class="card-title mb-0">Accounts</div>
        </div>
        <div th:if="${users == null or #lists.isEmpty(users)}" class="card-body text-body-secondary">No users yet.</div>
        <div class="card-body p-0" th:unless="${users == null or #lists.isEmpty(users)}">
          <div class="table-responsive">
            <table class="table border table-hover align-middle mb-0" data-filterable>
              <thead class="fw-semibold text-nowrap">
                <tr><th class="bg-body-secondary bg-body-secondary">Username</th><th class="bg-body-secondary bg-body-secondary">Roles</th><th class="bg-body-secondary bg-body-secondary">Enabled</th><th class="bg-body-secondary bg-body-secondary">Last login</th><th class="bg-body-secondary bg-body-secondary" style="width:320px;">Actions</th></tr>
              </thead>
              <tbody>
                <tr th:each="u : ${users}">
                  <td th:text="${u.username}">user</td>
                  <td th:text="${u.roles}">roles</td>
                  <td th:text="${u.enabled} ? 'yes' : 'no'">enabled</td>
                  <td th:text="${u.lastLoginAt ?: '—'}">time</td>
                  <td>
                    <form th:action="@{'/admin/users/' + ${u.id} + '/reset'}" method="post" style="display:inline-flex; gap:6px; align-items:center;">
                      <input type="password" name="newPassword" class="form-control form-control-sm" placeholder="new password" style="width:150px;" required="required"/>
                      <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-key"></i></button>
                    </form>
                    <form th:action="@{'/admin/users/' + ${u.id} + '/delete'}" method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this user?');">
                      <button type="submit" class="btn btn-outline-secondary btn-sm text-danger"><i class="fa-solid fa-trash"></i></button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/layout :: footer}"></div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
