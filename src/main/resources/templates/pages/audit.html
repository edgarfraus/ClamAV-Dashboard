<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Audit log')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<div class="wrapper d-flex flex-column min-vh-100">
  <div th:replace="~{fragments/layout :: header('Audit log')}"></div>

  <div class="body flex-grow-1">
    <div class="container-lg px-4">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
        <div class="text-body-secondary small">Last 200 recorded actions</div>
      </div>

      <div class="card">
        <div th:if="${auditEvents == null or #lists.isEmpty(auditEvents)}" class="card-body text-body-secondary">No audit events yet.</div>
        <div class="card-body p-0" th:unless="${auditEvents == null or #lists.isEmpty(auditEvents)}">
          <div class="table-responsive">
            <table class="table border table-hover align-middle mb-0" data-filterable>
              <thead class="fw-semibold text-nowrap">
                <tr><th class="bg-body-secondary bg-body-secondary">Time</th><th class="bg-body-secondary bg-body-secondary">User</th><th class="bg-body-secondary bg-body-secondary">Action</th><th class="bg-body-secondary bg-body-secondary">Details</th><th class="bg-body-secondary bg-body-secondary">Outcome</th><th class="bg-body-secondary bg-body-secondary">Job</th><th class="bg-body-secondary bg-body-secondary">IP</th></tr>
              </thead>
              <tbody>
                <tr th:each="a : ${auditEvents}">
                  <td th:text="${a.at}" class="mono">time</td>
                  <td th:text="${a.username ?: '—'}">user</td>
                  <td th:text="${a.action}" class="mono">action</td>
                  <td th:text="${a.details}" class="cell-truncate" style="max-width:320px;">details</td>
                  <td>
                    <span class="badge-status" th:classappend="${a.outcome == 'SUCCESS'} ? 'badge-ok' : 'badge-danger'" th:text="${a.outcome}">outcome</span>
                  </td>
                  <td>
                    <a th:if="${a.jobId}" th:href="@{'/jobs/' + ${a.jobId}}" th:text="${#strings.substring(a.jobId,0,8)}">job</a>
                    <span th:unless="${a.jobId}">—</span>
                  </td>
                  <td th:text="${a.ip ?: '—'}">ip</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/layout :: footer}"></div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
