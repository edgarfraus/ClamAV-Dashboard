<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Endpoints - ClamAV Web Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"/>
  <link rel="stylesheet" href="/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/css/fontawesome.min.css"/>
  <link rel="stylesheet" href="/css/all.css"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="icon" href="/icons/favicon.ico"/>
</head>
<body data-theme="dark">
<div class="app-shell">
  <div th:replace="~{fragments/nav :: sidebar}"></div>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <div class="app-title__name">Endpoints</div>
        <div class="app-title__subtitle">Manage the clamd endpoints this console can scan against</div>
      </div>
    </div>

    <div class="app-content">
      <div class="panel mb-3">
        <div class="panel-body">
          <div class="card-title mb-3"><i class="fa-solid fa-plus"></i> Add endpoint</div>
          <form th:action="@{/admin/endpoints/create}" method="post" class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" name="name" required="required"/>
            </div>
            <div class="col-md-3">
              <label class="form-label">Host</label>
              <input type="text" class="form-control" name="host" placeholder="clamav-server or IP" required="required"/>
            </div>
            <div class="col-md-2">
              <label class="form-label">Port</label>
              <input type="number" class="form-control" name="port" value="3310" required="required"/>
            </div>
            <div class="col-md-2">
              <label class="form-label">Platform</label>
              <select class="form-select" name="platform">
                <option value="UNIX">UNIX</option>
                <option value="WINDOWS">WINDOWS</option>
                <option value="JVM_PLATFORM">JVM_PLATFORM</option>
              </select>
            </div>
            <div class="col-md-1">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="enabled" value="true" id="newEnabled" checked="checked"/>
                <label class="form-check-label" for="newEnabled" style="font-size:12px;">Enabled</label>
              </div>
            </div>
            <div class="col-md-1">
              <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-plus"></i></button>
            </div>
          </form>
        </div>
      </div>

      <div class="panel">
        <div class="panel-body">
          <div class="card-title mb-3">Configured endpoints</div>
          <div th:if="${endpoints == null or #lists.isEmpty(endpoints)}" class="muted">No endpoints yet. Add one above.</div>
          <div class="table-responsive" th:unless="${endpoints == null or #lists.isEmpty(endpoints)}">
            <table class="table table-striped table-hover align-middle">
              <thead>
                <tr><th>Name</th><th>Host</th><th>Port</th><th>Platform</th><th>Enabled</th><th style="width:220px;">Actions</th></tr>
              </thead>
              <tbody>
                <tr th:each="e : ${endpoints}">
                  <td><input type="text" class="form-control form-control-sm" th:form="${'ep-form-' + e.id}" name="name" th:value="${e.name}" required="required"/></td>
                  <td><input type="text" class="form-control form-control-sm" th:form="${'ep-form-' + e.id}" name="host" th:value="${e.host}" required="required"/></td>
                  <td style="width:100px;"><input type="number" class="form-control form-control-sm" th:form="${'ep-form-' + e.id}" name="port" th:value="${e.port}" required="required"/></td>
                  <td style="width:150px;">
                    <select class="form-select form-select-sm" th:form="${'ep-form-' + e.id}" name="platform">
                      <option value="UNIX" th:selected="${e.platform.name() == 'UNIX'}">UNIX</option>
                      <option value="WINDOWS" th:selected="${e.platform.name() == 'WINDOWS'}">WINDOWS</option>
                      <option value="JVM_PLATFORM" th:selected="${e.platform.name() == 'JVM_PLATFORM'}">JVM_PLATFORM</option>
                    </select>
                  </td>
                  <td style="width:70px;">
                    <input type="checkbox" th:form="${'ep-form-' + e.id}" name="enabled" value="true" th:checked="${e.enabled}"/>
                  </td>
                  <td>
                    <button type="submit" th:form="${'ep-form-' + e.id}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                    <form th:action="@{'/admin/endpoints/' + ${e.id} + '/delete'}" method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this endpoint?');">
                      <button type="submit" class="btn btn-outline-light btn-sm text-danger"><i class="fa-solid fa-trash"></i></button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>

            <form th:each="e : ${endpoints}" th:id="${'ep-form-' + e.id}"
                  th:action="@{'/admin/endpoints/' + ${e.id} + '/update'}" method="post"></form>
          </div>
        </div>
      </div>
    </div>

    <div class="app-footer muted">ClamAV Web Client</div>
  </main>
</div>
<script src="/js/script.js"></script>
</body>
</html>
