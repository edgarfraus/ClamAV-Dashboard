<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Change password')}"></head>
<body>
<div class="login-shell">
  <div class="card shadow-sm" style="width:100%;max-width:440px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <img src="/images/logo.jpg" alt="" class="login-logo"/>
        <h4 class="mt-3 mb-1">Change password</h4>
        <div class="text-body-secondary small">
          Signed in as <strong sec:authentication="name">user</strong>
        </div>
      </div>

      <div class="alert alert-warning py-2" th:if="${forced}">
        This account still uses its initial password. Choose a new one to continue:
        until then the console and the API are locked for this account.
      </div>
      <div class="alert alert-danger py-2" th:if="${errorMsg}" th:text="${errorMsg}">error</div>

      <form th:action="@{/account/password}" method="post">
        <div class="mb-3">
          <label class="form-label" for="currentPassword">Current password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="currentPassword" name="currentPassword"
                   autocomplete="current-password" autofocus="autofocus" required="required"/>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="newPassword">New password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
            <input type="password" class="form-control" id="newPassword" name="newPassword"
                   autocomplete="new-password" required="required" th:attr="minlength=${minLength}"/>
          </div>
          <div class="form-text" th:text="'At least ' + ${minLength} + ' characters.'">At least 8 characters.</div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="confirmPassword">Repeat the new password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                   autocomplete="new-password" required="required" th:attr="minlength=${minLength}"/>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="fa-solid fa-check"></i> Change password
        </button>
      </form>

      <div class="d-flex justify-content-between mt-3">
        <a href="/dashboard" class="small" th:unless="${forced}">Back to the console</a>
        <form th:action="@{/logout}" method="post" class="ms-auto">
          <button type="submit" class="btn btn-link btn-sm p-0">Sign out</button>
        </form>
      </div>
      <div class="text-body-secondary small mt-3 text-center">
        You will be signed out and asked to sign in again with the new password.
      </div>
    </div>
  </div>
</div>
<script src="/js/coreui.bundle.min.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
