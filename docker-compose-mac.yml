# Compose per esecuzione LOCALE (questa macchina).
# La versione originale (con rete esterna "lan" e IP fisso) e' in docker-compose.yml.back
# Differenze rispetto all'originale:
#   - rimossa la rete esterna "lan" (bloccava l'avvio se non esistente)
#   - aggiunto il mapping porta 8080:8080 per raggiungere la UI da http://localhost:8080
services:
  clamav-web-client:
    build: .
    container_name: clamav-web-client
    ports:
      - "8080:8080"
    environment:
      - CLAMAV_HOST=clamav-server
      - CLAMAV_PORT=3310
    volumes:
      - ./conf:/app/conf
      - ./data:/app/data
      - ./scandir:/scandir:ro
    depends_on:
      - clamav-server

  clamav-server:
    image: clamav/clamav-debian:stable
    container_name: clamav
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  clamav-db: {}
